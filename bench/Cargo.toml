[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "db_bench-style workloads for RustLog, with RocksDB as the baseline."

[[bin]]
name = "db_bench"
path = "src/main.rs"

[features]
default = []
# Off by default: building RocksDB from source takes minutes and needs clang.
rocksdb = ["dep:rocksdb"]

[dependencies]
rustlog = { path = ".." }
bytes = "1.7"
hdrhistogram = "7.5"
rand = "0.9"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
rocksdb = { version = "0.25", default-features = false, optional = true, features = ["bindgen-runtime"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
